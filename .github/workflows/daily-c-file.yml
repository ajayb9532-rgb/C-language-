name: Daily C Project

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST every day
  workflow_dispatch:         # run manually from the Actions tab

permissions:
  contents: write
  models: read               # lets GITHUB_TOKEN call GitHub Models (no API key needed)

concurrency:
  group: daily-c-project
  cancel-in-progress: false

jobs:
  add-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's project
        run: python scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add projects
          git commit -m "Add daily project $(TZ=Asia/Kolkata date +%F)" || exit 0
          git push
