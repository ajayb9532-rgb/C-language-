name: Daily C Practice

on:
  schedule:
    # Runs at 00:00 India Standard Time (18:30 UTC) every day.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-c-practice
  cancel-in-progress: false

jobs:
  create-daily-practice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create today's C practice file
        run: |
          TODAY="$(TZ=Asia/Kolkata date +'%Y-%m-%d')"
          FILE="daily/day_${TODAY}.c"
          if [ -f "$FILE" ]; then
            echo "Today's practice file already exists: $FILE"
          else
            python scripts/add_daily_file.py --date "$TODAY"
          fi

      - name: Commit and push daily file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --cached --quiet; then
            echo "No new daily file to commit."
          else
            git commit -m "Add daily C practice for $(TZ=Asia/Kolkata date +'%Y-%m-%d')"
            git push
          fi
